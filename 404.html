<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found | CyberPehra</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { darkMode: 'class', theme: { extend: { colors: { background: '#04060A' }, fontFamily: { display: ['"Space Grotesk"', 'sans-serif'], mono: ['"IBM Plex Mono"', 'monospace'] } } } }

<style> body { background-color: #04060A; } </style>

<body class="text-slate-100 min-h-screen flex items-center justify-center p-6 relative overflow-hidden">

        <h1 class="font-display text-8xl font-extrabold text-green-400">404</h1>
        <div class="inline-block px-4 py-1.5 rounded-full border border-rose-500/50 bg-rose-950 text-rose-400 font-mono text-xs uppercase tracking-widest font-bold">Sector Not Found</div>
        <p class="text-slate-400 text-sm leading-relaxed">The page you are looking for has been moved, deleted, or never existed in the database.</p>
        <div class="pt-4">
            <a href="/" class="inline-block px-8 py-3.5 rounded-xl bg-gradient-to-r from-green-600 via-emerald-500 to-teal-400 hover:from-green-500 hover:to-emerald-300 text-slate-950 font-bold tracking-wide text-sm shadow-xl shadow-green-500/20 transition active:scale-95 font-display">
